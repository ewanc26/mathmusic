name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the expression(s) and options, for example the CLI command or UI settings.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Expression parser
        - Synthesis and audio export
        - Graph and piano roll UI
        - plyr.fm publishing
        - Build / CI
        - Other
    validations:
      required: true
